name: Publier PC GRAPIST
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Préparer uniquement les fichiers publics
        run: |
          test -s index.html
          test -s LICENSE
          mkdir -p _site
          cp index.html LICENSE _site/
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site à publier
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
